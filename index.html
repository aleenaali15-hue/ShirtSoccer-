<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shirt Soccer</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1a1f36;--line:#dde2ee;--acc:#2a9d4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1d2233;--text:#eef1fa;--line:#2f3652}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1d2233;--text:#eef1fa;--line:#2f3652}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:12px}
.wrap{max-width:460px;margin:0 auto}
h1{text-align:center;margin:4px 0;font-size:24px}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.tok{text-align:center;font-size:20px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end;margin-bottom:8px}
.row label{font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
input[type=text]{width:110px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input[type=color]{width:44px;height:32px;border:none;background:none}
select{padding:6px;border-radius:8px}
button{font-size:15px;font-weight:700;border:none;border-radius:10px;padding:9px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:#3b82f6}button.grey{background:#8a90a6}
button:disabled{opacity:.45}
#pv svg{width:130px;display:block;margin:0 auto}
.shirts{display:flex;gap:8px;overflow-x:auto;padding:4px}
.sh{flex:0 0 84px;text-align:center;border:3px solid transparent;border-radius:12px;position:relative;font-size:11px;cursor:pointer}
.sh.on{border-color:var(--acc)}
.sh svg{width:100%}
.sh i{position:absolute;top:0;right:2px;font-style:normal;background:#e63946;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;font-size:11px}
.ct{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.ct:last-child{border:none}
.ct span.f{font-size:24px}.ct b{flex:1}
.ct button{padding:6px 10px;font-size:13px;min-width:92px}
#play{width:100%;font-size:20px;padding:14px}
#game{display:none;text-align:center}
canvas{width:100%;max-width:420px;border-radius:12px;touch-action:none;background:#2e7d32}
.ctl{display:flex;gap:10px;justify-content:center;margin:8px 0}
.ctl button{flex:1;max-width:120px;font-size:20px;padding:14px 0;touch-action:manipulation}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:9}
#ov div{background:var(--card);padding:22px;border-radius:16px;text-align:center;max-width:300px}
#ov h2{font-size:24px}
body{background-image:linear-gradient(160deg,#ffd6e8,#d6f0ff,#e4ffd6);background-attachment:fixed}
@media (prefers-color-scheme:dark){body{background-image:linear-gradient(160deg,#2a1b3d,#14243d,#123024)}}
h1{font-size:32px;color:#ff3d81;text-shadow:3px 3px 0 #ffd23f;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.card{border-width:3px;border-style:dashed;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.card:nth-of-type(odd){border-color:#3a86ff}.card:nth-of-type(even){border-color:#ff9f1c}
button{border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}button:active{transform:translateY(3px);box-shadow:none}
#play{animation:pulse 1.2s infinite;background:linear-gradient(90deg,#ff3d81,#ff9f1c)}
@keyframes pulse{50%{transform:scale(1.04)}}
.tok{font-size:24px}.sh svg{transition:transform .15s}.sh:hover svg{transform:rotate(-4deg) scale(1.05)}
</style></head><body><div class="wrap">
<div id="home">
<h1>⚽ Shirt Soccer 🏆</h1>
<div class="card tok" id="tok"></div>
<div class="card"><h2>👋 What's your name?</h2><div class="row"><input type="text" id="me" placeholder="Type your name" maxlength="12" style="width:220px;font-size:16px"></div></div>
<div class="card"><h2>1. Make your player</h2>
<div id="pv"></div>
<div class="row"><label>Copy a star<select id="rp"><option value="">Pick…</option></select></label><label>Name on shirt<input type="text" id="n" value="YOU" maxlength="10"></label>
<label>No.<input type="text" id="no" value="7" maxlength="2" style="width:44px"></label>
<label>Style<select id="p"><option value="solid">Plain</option><option value="stripes">Stripes</option><option value="hoops">Hoops</option></select></label></div>
<div class="row"><label>Shirt<input type="color" id="c1" value="#e63946"></label><label>Sleeves<input type="color" id="c2" value="#1d3557"></label><label>Stripes<input type="color" id="c3" value="#ffffff"></label><label>Text<input type="color" id="c4" value="#ffd60a"></label></div>
<div class="row"><label>Skin<input type="color" id="sk" value="#c68642"></label><label>Hair<input type="color" id="hc" value="#2b1b12"></label><label>I am a<select id="gd"><option value="boy">Boy</option><option value="girl">Girl</option></select></label><label>Hair style<select id="hs"><option value="short">Short</option><option value="long">Long</option><option value="bun">Bun</option><option value="curly">Curly</option></select></label><label>Shorts/Skirt<input type="color" id="c5" value="#ffffff"></label></div>
<div class="row"><button id="add">➕ Add</button></div></div>
<div class="card"><h2>2. My players (tap to choose)</h2><div class="shirts" id="shirts"></div></div>
<div class="card"><h2>🏆 My Ballon d'Ors</h2><div class="shirts" id="troph"></div></div>
<div class="card"><h2>3. Countries</h2><div id="cts"></div></div>
<button id="play">▶ PLAY</button>
</div>
<div id="game"><canvas id="cv" width="360" height="520"></canvas>
<div class="ctl"><button id="bl" class="alt">◀</button><button id="sh">SHOOT</button><button id="br" class="alt">▶</button></div>
<button class="alt" id="pz">⏸ Pause</button> <button class="grey" id="quit">Quit</button></div>
</div>
<div id="ov"><div><h2 id="ot"></h2><p id="op"></p><button id="o1"></button> <button class="grey" id="o2">Home</button></div></div>
<script>
const $=i=>document.getElementById(i);
const C=[['Pakistan','🇵🇰',0,'#01411c','#01411c','#fff'],['Egypt','🇪🇬',100,'#c8102e','#c8102e','#fff'],['Italy','🇮🇹',150,'#0055a4','#0055a4','#fff'],['Korea','🇰🇷',200,'#cd2e3a','#cd2e3a','#fff'],['UK','🇬🇧',250,'#fff','#fff','#1c2a5b'],['France','🇫🇷',300,'#1d3f94','#1d3f94','#fff'],['Japan','🇯🇵',350,'#1a3a8a','#1a3a8a','#fff'],['Turkey','🇹🇷',400,'#e30a17','#e30a17','#fff'],['Australia','🇦🇺',450,'#ffcd00','#00843d','#00543a'],['Mexico','🇲🇽',500,'#006847','#006847','#fff'],['Brazil','🇧🇷',600,'#fedd00','#fedd00','#0a7a3d'],['Saudi Arabia','🇸🇦',700,'#fff','#006c35','#006c35'],['China','🇨🇳',800,'#de2910','#de2910','#ffde00'],['USA','🇺🇸',900,'#fff','#b22234','#1c2a5b'],['Canada','🇨🇦',1000,'#d52b1e','#d52b1e','#fff']];
let S={tok:0,own:[0],sel:0,ctry:0,shirts:[{name:'YOU',no:'7',c:'#e63946',m:'#1d3557',s:'#fff',p:'solid',t:'#ffd60a'}]};
try{const r=localStorage.getItem('shirtsoccer');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('shirtsoccer',JSON.stringify(S))}catch(e){}};
let uid=0;
function jersey(j){const id='clip'+(uid++);const body="M105 18 Q150 40 195 18 L262 48 L292 120 L240 140 L232 300 L68 300 L60 140 L8 120 L38 48 Z";let pat='';
if(j.p==='stripes')for(let x=66;x<234;x+=28)pat+=`<rect x="${x}" width="14" height="320" fill="${j.s}"/>`;
if(j.p==='hoops')for(let y=150;y<300;y+=36)pat+=`<rect y="${y}" width="300" height="18" fill="${j.s}"/>`;
const nm=(j.name||'').toUpperCase(),fs=nm.length>8?19:nm.length>6?23:27;
return `<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="300" height="320" fill="${j.c}"/>${pat}<path d="M38 48 L8 120 L60 140 L68 60Z" fill="${j.m}"/><path d="M262 48 L292 120 L240 140 L232 60Z" fill="${j.m}"/><path d="M60 140 L68 60 M240 140 L232 60" stroke="#000" stroke-width="2.5"/></g><path d="${body}" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M105 18 Q150 40 195 18" fill="none" stroke="${j.t}" stroke-width="7"/><text x="150" y="98" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" letter-spacing="1.5" fill="${j.t}" stroke="#0006" stroke-width="2" paint-order="stroke">${nm}</text><text x="150" y="215" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="120" fill="${j.t}" stroke="#0006" stroke-width="3" paint-order="stroke">${j.no}</text></svg>`}
function char(j){const k=j.k||'#f1c27d',h=j.h||'#2b1b12',sh=j.sh||'#222',hs=j.hs||'short',m=j.m,g=j.g==='girl';const body=jersey(j).replace('<svg ','<svg x="0" y="95" width="300" height="320" ');let hb='',hf='';
if(hs==='long')hb=`<path d="M105 50 Q100 150 120 160 L180 160 Q200 150 195 50Z" fill="${h}" stroke="#000" stroke-width="2"/>`;
if(hs==='bun')hf=`<circle cx="150" cy="14" r="17" fill="${h}" stroke="#000" stroke-width="2"/>`;
if(hs==='curly')for(let a=0;a<9;a++)hf+=`<circle cx="${150+38*Math.cos(a*.75+3.4)}" cy="${55+36*Math.sin(a*.75+3.4)}" r="14" fill="${h}"/>`;
const leg=x=>`<rect x="${x}" y="430" width="48" height="60" rx="10" fill="${k}" stroke="#000" stroke-width="2"/><rect x="${x}" y="458" width="48" height="34" fill="${m}" stroke="#000" stroke-width="2"/><rect x="${x-4}" y="490" width="56" height="18" rx="8" fill="#111"/>`;
return `<svg viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg">${hb}${leg(85)}${leg(167)}<path d="${g?'M72 385 L228 385 L248 448 L52 448Z':'M72 385 L228 385 L222 450 L158 450 L150 420 L142 450 L78 450Z'}" fill="${sh}" stroke="#000" stroke-width="2.5"/><path d="M26 200 L18 300" stroke="#000" stroke-width="26" stroke-linecap="round"/><path d="M26 200 L18 300" stroke="${k}" stroke-width="22" stroke-linecap="round"/><path d="M274 200 L282 300" stroke="#000" stroke-width="26" stroke-linecap="round"/><path d="M274 200 L282 300" stroke="${k}" stroke-width="22" stroke-linecap="round"/>${body}<circle cx="108" cy="62" r="8" fill="${k}"/><circle cx="192" cy="62" r="8" fill="${k}"/><circle cx="150" cy="58" r="42" fill="${k}" stroke="#000" stroke-width="2.5"/><ellipse cx="150" cy="50" rx="43" ry="38" fill="${h}"/>${hf}${g?'<path d="M150 16 L128 4 L128 28Z M150 16 L172 4 L172 28Z" fill="#ff5fa2" stroke="#000" stroke-width="2"/><circle cx="150" cy="16" r="6" fill="#ff5fa2" stroke="#000" stroke-width="2"/>':''}</svg>`}
const esc=s=>s.replace(/[<>&"]/g,'');
function ballon(t){const id='bg'+(uid++);return `<svg viewBox="0 0 80 112" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff6b8"/><stop offset=".5" stop-color="#f0b400"/><stop offset="1" stop-color="#8a5a00"/></radialGradient></defs><path d="M30 94 L50 94 L54 104 L26 104Z" fill="#111"/><rect x="18" y="100" width="44" height="11" rx="3" fill="#111"/><rect x="34" y="68" width="12" height="28" fill="#d9a400"/><ellipse cx="40" cy="96" rx="16" ry="4" fill="#f0b400"/><circle cx="40" cy="37" r="33" fill="url(#${id})" stroke="#6b4500" stroke-width="2"/><path d="M40 23 L53 32 L48 47 L32 47 L27 32Z" fill="#b8860b" stroke="#6b4500"/><path d="M40 23 L40 5 M53 32 L68 27 M48 47 L58 61 M32 47 L22 61 M27 32 L12 27" stroke="#6b4500" stroke-width="1.5"/><text x="40" y="109" font-size="9" text-anchor="middle">${t.f}</text></svg>`}
function cur(){return{name:esc($('n').value),no:esc($('no').value),c:$('c1').value,m:$('c2').value,s:$('c3').value,p:$('p').value,t:$('c4').value,k:$('sk').value,h:$('hc').value,hs:$('hs').value,sh:$('c5').value,g:$('gd').value}}
function pv(){$('pv').innerHTML=char(cur())}
function render(){
$('tok').textContent='🪙 '+S.tok+' tokens';
$('troph').innerHTML=(S.troph||[]).length?S.troph.map(t=>`<div class="sh" style="cursor:default">${ballon(t)}<br>${t.f} ${t.c}<br><b>${t.p}</b></div>`).join(''):'<small>Win a match to get your first golden ball! ✨</small>';
$('shirts').innerHTML=S.shirts.map((j,i)=>`<div class="sh ${i==S.sel?'on':''}" data-i="${i}">${char(j)}${S.shirts.length>1?`<i data-d="${i}">✕</i>`:''}</div>`).join('');
$('cts').innerHTML=C.map((c,i)=>{const o=S.own.includes(i);return `<div class="ct"><span class="f">${c[1]}</span><b>${c[0]}</b><button data-c="${i}" class="${o?(S.ctry==i?'':'alt'):'grey'}" ${(!o&&S.tok<c[2])?'disabled':''}>${o?(S.ctry==i?'✔ Playing':'Choose'):'Buy 🪙'+c[2]}</button></div>`}).join('')}
['n','no','p','c1','c2','c3','c4','sk','hc','hs','c5','gd'].forEach(i=>$(i).addEventListener('input',pv));
$('add').onclick=()=>{if(S.shirts.length>=12){alert('Max 12 shirts! Remove one first.');return}S.shirts.push(cur());S.sel=S.shirts.length-1;save();render()};
$('shirts').onclick=e=>{const d=e.target.dataset.d;if(d!==undefined){S.shirts.splice(+d,1);S.sel=0;save();render();return}const s=e.target.closest('.sh');if(s){S.sel=+s.dataset.i;save();render()}};
$('cts').onclick=e=>{const i=e.target.dataset.c;if(i===undefined)return;const c=C[i];if(!S.own.includes(+i)){if(S.tok<c[2])return;S.tok-=c[2];S.own.push(+i)}S.ctry=+i;save();render()};
pv();render();
const RP=[['Ronaldo','7','#9b2335','#9b2335','#1f4d34','solid','#e8b73a'],['Messi','10','#75aadb','#75aadb','#ffffff','stripes','#1b1b3a'],['Yamal','10','#a50044','#004d98','#004d98','stripes','#edbb00'],['Haaland','9','#6cabdd','#6cabdd','#6cabdd','solid','#ffffff'],['Salah','11','#d00027','#d00027','#d00027','solid','#ffffff'],['Pepe','3','#ffffff','#ffffff','#0a3d91','stripes','#06255a'],['Mbappé','10','#ffffff','#ffffff','#ffffff','solid','#2b2b5c'],['Neymar','10','#fedd00','#fedd00','#fedd00','solid','#0a7a3d'],['Kane','9','#dc052d','#dc052d','#dc052d','solid','#ffffff']];
$('rp').innerHTML+=RP.map((r,i)=>`<option value="${i}">${r[0]}</option>`).join('');
$('rp').onchange=()=>{const r=RP[$('rp').value];if(!r)return;['n','no','c1','c2','c3','p','c4'].forEach((id,k)=>$(id).value=r[k]);pv()};
$('gd').onchange=()=>{$('hs').value=$('gd').value==='girl'?'long':'short';pv()};
$('me').value=S.me||'';if(S.me){$('n').value=S.me.slice(0,10);pv()}
$('me').oninput=()=>{S.me=esc($('me').value);$('n').value=S.me.slice(0,10)||'YOU';save();pv()};

// ---------- GAME ----------
const cv=$('cv'),x=cv.getContext('2d'),GL=70,GR=290,GY=110,TOL=40,imgs={};
function img(j){const k=JSON.stringify(j);if(!imgs[k]){const m=new Image();m.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(char(j));imgs[k]=m}return imgs[k]}
let G=null,last=0,keys={},mv=0;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const OPN=['Jim Bob','Jeffery','Aleenaaa','Lalag','Ronaldo','Messi','67','Pepe','Zoomer','Noodle','Bubbles','Mango','Yamal','Haaland','Salah','Waffles','Pickle'];
function start(){const c=C[S.ctry],on=OPN[Math.floor(Math.random()*OPN.length)];
G={me:0,op:0,time:300,ph:'aim',t:0,kx:180,ok:180,aim:180,dir:1,lvl:S.ctry,role:'att',msg:'',done:0,my:S.shirts[S.sel]||S.shirts[0],
opj:{name:on,no:on==='67'?'67':on==='Ronaldo'?'7':on==='Messi'?'10':String(Math.ceil(rnd(1,23))),c:c[3],m:c[4],s:c[3],p:'solid',t:c[5],k:['#f1c27d','#c68642','#8d5524','#e0ac69'][Math.floor(rnd(0,4))],h:['#111','#5a3825','#d4a017','#222'][Math.floor(rnd(0,4))],hs:['short','curly','bun','long'][Math.floor(rnd(0,4))],sh:'#fff',g:Math.random()<.4?'girl':'boy'},bx:180,by:410};
$('home').style.display='none';$('game').style.display='block';$('ov').style.display='none';$('pz').textContent='⏸ Pause';last=performance.now();requestAnimationFrame(loop)}
function shoot(){if(!G||G.paused||G.ph!=='aim')return;const lv=G.lvl,miss=G.aim<GL+8||G.aim>GR-8;
const react=Math.random()<.3+lv*.03;G.kt=react?G.aim+rnd(-22,22):rnd(GL+25,GR-25);G.k0=G.ok;
G.saved=!miss&&Math.abs(G.kt-G.aim)<TOL+lv&&Math.random()>.12;G.miss=miss;G.tx=G.aim;G.ph='shot';G.t=0}
function loop(n){if(!G)return;const dt=Math.min(.05,(n-last)/1e3);last=n;if(!G.paused)update(dt);draw();if(G&&!G.over)requestAnimationFrame(loop)}
function turnEnd(){
if(G.role==='def'&&G.time<=0&&G.me!==G.op){finish();return}
G.ph='aim';G.role='att';G.ok=180;G.aim=180}
function update(dt){G.time=Math.max(0,G.time-dt);G.t+=dt;G.clk=(G.clk||0)+dt;G.cheer=Math.max(0,(G.cheer||0)-dt);
const d=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+mv;if(d)G.kx=cl(G.kx+d*230*dt,GL,GR);
if(G.ph==='aim'){G.aim+=G.dir*270*dt;if(G.aim>GR+40){G.aim=GR+40;G.dir=-1}if(G.aim<GL-40){G.aim=GL-40;G.dir=1}}
else if(G.ph==='shot'){const p=Math.min(1,G.t/.5);G.bx=180+(G.tx-180)*p;G.by=410-(410-(GY+35))*p;G.ok=G.k0+(G.kt-G.k0)*Math.min(1,G.t/.4);
if(G.t>=.5){G.msg=G.miss?'MISS! 😬':G.saved?'SAVED! 🧤':'GOAL! ⚽';if(!G.miss&&!G.saved){G.me++;G.cheer=2}G.ph='res';G.next='ready';G.t=0}}
else if(G.ph==='res'){if(G.t>1.2){if(G.next==='ready'){G.ph='ready';G.role='def';G.msg='';G.bx=180;G.by=410;G.t=0}else turnEnd()}}
else if(G.ph==='ready'){if(G.t>1.4){const m=Math.random()<Math.max(.2,.4-G.lvl*.015);G.dm=m;G.tx=m?(Math.random()<.5?rnd(GL-60,GL-20):rnd(GR+20,GR+60)):rnd(GL+12,GR-12);G.ph='dshot';G.t=0}}
else if(G.ph==='dshot'){const p=Math.min(1,G.t/.6);G.bx=180+(G.tx-180)*p;G.by=410-(410-(GY+35))*p;
if(G.t>=.6){const sv=!G.dm&&Math.abs(G.kx-G.tx)<TOL+2;G.msg=G.dm?'They MISSED! 😅':sv?'SAVED! 🧤':'They scored 😬';if(!G.dm&&!sv)G.op++;G.ph='res';G.next='aim';G.t=0}}}
function boom(){G.conf=[];const cols=['#ff3d81','#ffd23f','#3a86ff','#2ec4b6','#fff','#ff9f1c'];
for(let i=0;i<180;i++){const l=i%2;G.conf.push({x:l?0:360,y:520,vx:(l?1:-1)*rnd(60,320),vy:-rnd(350,750),c:cols[i%6],r:rnd(0,6),w:rnd(5,10)})}
let t0=performance.now();(function f(n){if(!G||!G.conf)return;const dt=Math.min(.05,(n-t0)/1e3);t0=n;G.clk+=dt;draw();G.conf.forEach(p=>{p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*8;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(G.conf.some(p=>p.y<540))requestAnimationFrame(f)})(t0)}
function finish(){G.over=true;const w=G.me>G.op;if(w){S.tok+=100;(S.troph=S.troph||[]).push({f:C[S.ctry][1],c:C[S.ctry][0],p:S.me||G.my.name||'YOU'});save();render()}
$('ot').textContent=w?'🏆 YOU WON!':'😢 You lost!';
$('op').textContent=`${G.me} - ${G.op}`+(w?'  +100 🪙 + a golden ball 🏆':'  Restart the game!');
$('o1').textContent=w?'Play again':'Restart';$('o1').onclick=start;if(w){G.cheer=999;boom();setTimeout(()=>{if(G&&G.over)$('ov').style.display='flex'},3300)}else $('ov').style.display='flex'}
const SK=['#f1c27d','#c68642','#8d5524','#e0ac69'];
function crowd(c){x.fillStyle='#3b3f58';x.fillRect(0,0,360,96);const P=[c[3],c[4],'#fff','#ffd23f','#ff6b9d','#4cc9f0'],ch=G.cheer>0,k=G.clk||0;
for(let r=0;r<3;r++){x.fillStyle='rgba(255,255,255,.08)';x.fillRect(0,56+r*16,360,3);
for(let i=0;i<28;i++){const px=8+i*13+(r%2)*6,py=48+r*16,dy=ch?-Math.abs(Math.sin(k*9+i*1.7+r))*5:0;
x.fillStyle=P[(i*7+r*3)%6];x.fillRect(px-5,py+5+dy,10,10);x.fillStyle=SK[(i+r)%4];x.beginPath();x.arc(px,py+dy,5,0,7);x.fill();
if(ch){x.fillRect(px-8,py-4+dy,2,9);x.fillRect(px+6,py-4+dy,2,9)}}}}
function pl(j,px,py,w){const m=img(j);if(m.complete&&m.naturalWidth)x.drawImage(m,px-w/2,py,w,w*1.73)}
function draw(){const c=C[S.ctry];
crowd(c);
x.fillStyle='#2e7d32';x.fillRect(0,95,360,430);x.fillStyle='#388e3c';for(let i=0;i<8;i++)if(i%2)x.fillRect(0,95+i*54,360,54);
x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(GL,GY,GR-GL,70);x.lineWidth=1;x.globalAlpha=.4;
for(let i=GL;i<GR;i+=14){x.beginPath();x.moveTo(i,GY);x.lineTo(i,GY+70);x.stroke()}for(let j=GY;j<GY+70;j+=14){x.beginPath();x.moveTo(GL,j);x.lineTo(GR,j);x.stroke()}x.globalAlpha=1;
x.lineWidth=3;x.strokeRect(30,GY,300,150);x.beginPath();x.arc(180,410,3,0,7);x.stroke();
const att=G.role==='att';
if(att){pl(G.opj,G.ok,GY+2,40);pl(G.my,150,430,44)}else{pl(G.my,G.kx,GY+2,44);pl(G.opj,150,430,44)}
if(G.ph==='aim'){x.strokeStyle='#e63946';x.lineWidth=4;x.beginPath();x.arc(G.aim,GY+35,15,0,7);x.moveTo(G.aim-22,GY+35);x.lineTo(G.aim+22,GY+35);x.moveTo(G.aim,GY+13);x.lineTo(G.aim,GY+57);x.stroke()}
const sh=G.ph==='shot'||G.ph==='dshot',bx=sh?G.bx:180,by=sh?G.by:410,r=sh?9-4*(410-by)/300:9;
x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.arc(bx,by,r,0,7);x.fill();x.stroke();
x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,360,34);x.fillStyle='#fff';x.font='bold 16px system-ui';x.textAlign='left';x.fillText((S.me||G.my.name||'YOU').toUpperCase().slice(0,9)+' '+G.me,10,23);
x.textAlign='right';x.fillText(c[1]+' '+G.opj.name+' '+G.op,350,23);x.textAlign='center';
const t=Math.ceil(G.time);x.fillText(t>0?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):'SUDDEN DEATH',180,23);
x.font='bold 17px system-ui';x.lineWidth=4;
const tip=G.ph==='aim'?(G.time>290?'vs '+G.opj.name+'! Tap SHOOT!':'Tap SHOOT to score!'):G.ph==='ready'?'Get ready to DEFEND! Move ◀ ▶':G.ph==='dshot'?'Block it!':G.msg;
const big=G.ph==='res';x.font=big?'bold 30px system-ui':'bold 16px system-ui';x.strokeStyle='#000';x.strokeText(big?G.msg:tip,180,big?300:330);x.fillStyle='#fff';x.fillText(big?G.msg:tip,180,big?300:330);if(G.paused){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,360,520);x.fillStyle='#fff';x.font='bold 40px system-ui';x.textAlign='center';x.fillText('⏸ PAUSED',180,270)}}
function pt(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*360/r.width}
cv.addEventListener('pointerdown',e=>{if(!G||G.paused)return;if(G&&G.ph==='aim')shoot();else if(G)G.kx=cl(pt(e),GL,GR)});
cv.addEventListener('pointermove',e=>{if(G&&!G.paused&&e.buttons&&G.role==='def')G.kx=cl(pt(e),GL,GR)});
const hold=(b,v)=>{b.addEventListener('pointerdown',e=>{e.preventDefault();mv=v});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>mv=0))};
hold($('bl'),-1);hold($('br'),1);$('sh').onclick=shoot;
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='p'||e.key==='P')pause();if(e.key===' ')shoot()});addEventListener('keyup',e=>keys[e.key]=0);
function pause(){if(!G||G.over)return;G.paused=!G.paused;mv=0;$('pz').textContent=G.paused?'▶ Resume':'⏸ Pause'}
$('pz').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.paused)pause()});
$('play').onclick=start;
function home(){if(G)G.over=true;G=null;$('ov').style.display='none';$('game').style.display='none';$('home').style.display='block';render()}
$('quit').onclick=home;$('o2').onclick=home;
</script></body></html>
